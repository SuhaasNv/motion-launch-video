<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Launch film</title>
<!--
  FILM TEMPLATE (runs as-is: 10 s, three scenes). Copy to <work>/film.html, then:
    1. BRAND   swap the tokens and @font-face files below for the product's own (copy its woff2 files into <work>/fonts/).
    2. MARK    replace the glyph paths in #markGlyph and #endGlyph with the product's logo strokes (keep pathLength="1").
    3. SCENES  rewrite scene B's copy and card from the product's real UI and words; add scenes from references/motion-playbook.md.
  Contract with scripts/render.mjs: window.DUR, window.seek(t, frame), window.fontsReady. Everything is a pure function of t:
  no CSS transitions/animations, no Date.now, no Math.random (use hash()).
  Preview: serve the folder and open film.html?play  or  film.html?t=4.2
-->
<style>
/* ---------- 1. BRAND ---------- */
@font-face{font-family:'Display';font-style:normal;src:url(fonts/display.woff2) format('woff2')}
@font-face{font-family:'Display';font-style:italic;src:url(fonts/display-italic.woff2) format('woff2')}
@font-face{font-family:'UI';font-weight:400 700;src:url(fonts/ui.woff2) format('woff2')}
@font-face{font-family:'Mono';font-weight:400 500;src:url(fonts/mono.woff2) format('woff2')}
:root{
  --bg:#0E131A;          /* deep background: the product's darkest neutral, pushed darker */
  --brand:#A8192A;       /* brand colour: the mark, one accent per scene, glows */
  --accent:#EFB8BE;      /* the italic key word in each headline */
  --mist:#AEB6C2;        /* secondary text on dark */
  --ink:#1B2430; --ink2:#465060; --ink3:#616C7A; --line:#D9DEE5; --soft:#F2F4F7;
  --ok:#067647; --okS:#ECFDF3; --okL:#A6E9C4;
  --info:#175CD3; --infoS:#EEF4FF; --infoL:#B2CCFA;
  --display:'Display','Georgia',serif; --ui:'UI',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'Mono',ui-monospace,'SFMono-Regular',monospace;
}
/* ---------- base ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
body{font-family:var(--ui);color:#fff;-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
.abs{position:absolute}
.full{position:absolute;left:0;top:0;width:1920px;height:1080px}
.scene{position:absolute;inset:0;transform-origin:960px 540px;visibility:hidden}
.display{font-family:var(--display);font-weight:400;line-height:1.02;letter-spacing:-.01em}
.it{font-style:italic;color:var(--accent)}
.mono{font-family:var(--mono)}
.eyebrow{font:500 22px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--mist);white-space:pre}
/* mask reveal: text rises from behind an overflow edge. Padding keeps italics and descenders unclipped. */
.mk{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .08em .2em;margin:0 -.08em -.2em}
.mk>span{display:inline-block;will-change:transform}
.card{position:absolute;background:#fff;border-radius:18px;color:var(--ink);box-shadow:0 50px 90px -30px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.05)}
.pill{display:inline-flex;align-items:center;gap:10px;height:40px;padding:0 18px;border-radius:999px;font:600 20px/1 var(--ui);border:1.5px solid;white-space:nowrap}
.pill i{width:10px;height:10px;border-radius:50%;background:currentColor}
.p-info{color:var(--info);background:var(--infoS);border-color:var(--infoL)}
.p-ok{color:var(--ok);background:var(--okS);border-color:var(--okL)}
svg{overflow:visible}
/* atmosphere */
#glowA,#glowB{position:absolute;left:0;top:0;border-radius:50%}
#glowA{width:1800px;height:1800px;background:radial-gradient(closest-side,color-mix(in srgb,var(--brand) 62%,transparent),color-mix(in srgb,var(--brand) 18%,transparent) 55%,transparent)}
#glowB{width:1400px;height:1400px;background:radial-gradient(closest-side,color-mix(in srgb,var(--brand) 45%,transparent),transparent)}
#dots{position:absolute;left:-96px;top:-96px;width:2208px;height:1272px;background-image:radial-gradient(rgba(255,255,255,.55) 1.2px,transparent 1.6px);background-size:48px 48px;opacity:.07}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.42) 100%)}
#grain{position:absolute;inset:0;width:1920px;height:1080px;opacity:.075;mix-blend-mode:overlay;image-rendering:pixelated}
#flash{position:absolute;inset:0;background:#fff;opacity:0;mix-blend-mode:overlay}
/* scene B card rows */
.row{position:absolute;left:0;width:100%;height:100px;display:flex;align-items:center;padding:0 40px;gap:22px;border-top:1.5px solid #EEF0F3}
.num{width:50px;height:50px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font:500 18px var(--mono);color:var(--ink3);position:relative;flex:none}
.rt{font:600 25px/1.2 var(--ui)} .rs{font:400 18px/1.3 var(--ui);color:var(--ink3);margin-top:4px}
</style>
</head>
<body>
<div id="stage">
  <div class="full"><div id="glowA"></div><div id="glowB"></div><div id="dots"></div></div>

  <!-- ===== Scene A: the mark builds itself, then the wordmark (0 to ~3 s) ===== -->
  <div class="full" id="wA"><div class="scene" id="sA">
    <div id="ringA" class="abs" style="left:760px;top:340px;width:400px;height:400px;border-radius:50%;border:2px solid var(--accent)"></div>
    <div id="rays" class="abs" style="left:960px;top:540px"></div>
    <div id="markWrap" class="abs" style="left:850px;top:430px;width:220px;height:220px">
      <div id="markBox" class="abs" style="background:var(--brand);left:50%;top:50%"></div>
      <!-- 2. MARK: the logo's inner strokes on a 32-unit grid, drawn one after another -->
      <svg id="markGlyph" class="abs" style="left:0;top:0" width="220" height="220" viewBox="0 0 32 32">
        <g fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path class="gs" d="M9 22 L16 9 L23 22" pathLength="1"/>
          <path class="gs" d="M12.5 17.5 H19.5" pathLength="1"/>
        </g>
      </svg>
    </div>
    <div id="word" class="abs" style="top:462px;font:700 150px/1 var(--ui);letter-spacing:-.02em;white-space:nowrap">Product</div>
    <div id="ebA" class="abs eyebrow" style="top:668px;font-size:26px"></div>
  </div></div>

  <!-- diagonal wipe slabs (scene A -> B) -->
  <div id="slabs" class="full" style="pointer-events:none">
    <div id="slab1" class="abs" style="top:-200px;height:1480px;width:900px;background:#2A3442"></div>
    <div id="slab2" class="abs" style="top:-200px;height:1480px;width:1500px;background:var(--brand)"></div>
    <div id="slab3" class="abs" style="top:-200px;height:1480px;width:60px;background:var(--accent)"></div>
  </div>

  <!-- ===== Scene B: the promise + a product card doing its job (~3 to 7 s) ===== -->
  <div class="full" id="wB"><div class="scene" id="sB" style="perspective:2400px">
    <div class="abs eyebrow" id="ebB" style="left:146px;top:200px;color:var(--accent)">01 · THE PROMISE</div>
    <div class="abs display" id="hB1" style="left:140px;top:250px;font-size:220px"><span class="mk"><span>Say it</span></span></div>
    <div class="abs display it" id="hB2" style="left:140px;top:480px;font-size:220px"><span class="mk"><span>once.</span></span></div>
    <div class="abs" id="subB" style="left:146px;top:780px;width:760px;font:400 32px/1.4 var(--ui);color:var(--mist)">One line from the product's own landing page.</div>
    <div id="cardB" class="card" style="left:1060px;top:170px;width:720px;height:700px;transform-origin:0 50%">
      <div class="abs mono" style="left:40px;top:40px;font-size:18px;color:var(--ink3);letter-spacing:.04em">REF-0001</div>
      <div class="abs" style="right:40px;top:32px;width:180px;height:40px">
        <span id="bDraft" class="pill p-info abs" style="right:0"><i></i>In progress</span>
        <span id="bDone" class="pill p-ok abs" style="right:0"><i></i>Done</span>
      </div>
      <div class="abs" style="left:40px;top:90px;font:600 40px/1.2 var(--ui);letter-spacing:-.015em">A real screen, rebuilt</div>
      <div class="abs" style="left:40px;right:40px;top:170px;height:8px;border-radius:4px;background:#EEF0F3;overflow:hidden"><div id="barB" style="height:100%;width:0;background:var(--ok)"></div></div>
      <div id="rowsB" class="abs" style="left:0;right:0;top:220px;height:400px"></div>
    </div>
  </div></div>

  <!-- ===== Scene C: end card (~6.6 to 10 s) ===== -->
  <div class="scene" id="sC">
    <div id="endLock" class="abs" style="top:330px;height:130px;display:flex;align-items:center;gap:34px">
      <div style="position:relative;width:124px;height:124px">
        <div id="eBox" class="abs" style="inset:0;border-radius:27px;background:var(--brand)"></div>
        <svg id="endGlyph" class="abs" style="left:0;top:0" width="124" height="124" viewBox="0 0 32 32"><g fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path class="es" d="M9 22 L16 9 L23 22" pathLength="1"/><path class="es" d="M12.5 17.5 H19.5" pathLength="1"/></g></svg>
      </div>
      <div id="eWord" style="font:700 124px/1 var(--ui);letter-spacing:-.02em;white-space:nowrap">Product</div>
    </div>
    <div id="tagC" class="abs display" style="left:0;width:1920px;text-align:center;top:540px;font-size:86px"><span class="mk"><span>The</span></span> <span class="mk"><span>tagline,</span></span> <span class="mk it"><span>landed.</span></span></div>
    <div id="urlC" class="abs" style="left:0;width:1920px;text-align:center;top:680px;font:600 38px var(--ui)">product.example</div>
    <div id="discC" class="abs" style="left:0;width:1920px;text-align:center;top:972px;font:400 20px var(--ui);color:#8A94A3">Any legal line the product needs (fictional service, beta, availability).</div>
  </div>

  <div id="flash"></div><div id="vig"></div>
  <canvas id="grain" width="960" height="540"></canvas>
</div>

<script>
// ================= timeline engine (keep) =================
window.DUR = 10;                 // seconds; render.mjs reads this
window.SIZE = [1920, 1080];
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,a,b)=>clamp((t-a)/(b-a));                 // progress of t through [a,b]
const lerp=(a,b,x)=>a+(b-a)*x;
const E={
  lin:x=>x, outCubic:x=>1-Math.pow(1-x,3), inCubic:x=>x*x*x,
  inOutCubic:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, inOutSine:x=>-(Math.cos(Math.PI*x)-1)/2,
  outQuint:x=>1-Math.pow(1-x,5), outExpo:x=>x>=1?1:1-Math.pow(2,-10*x), inExpo:x=>x<=0?0:Math.pow(2,10*x-10),
  inOutExpo:x=>x<=0?0:x>=1?1:x<.5?Math.pow(2,20*x-10)/2:(2-Math.pow(2,-20*x+10))/2,
  outBack:x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)},
  spring:x=>x>=1?1:1-Math.exp(-6.5*x)*Math.cos(13*x),
};
const A=(t,a,b,e='outExpo')=>E[e](P(t,a,b));          // eased progress
const pulse=(t,at,w)=>Math.exp(-Math.pow((t-at)/w,2));  // bell-shaped spike, for hits and flashes
const $=id=>document.getElementById(id);
function hash(n){n=(n<<13)^n;return 1-((n*(n*n*15731+789221)+1376312589)&0x7fffffff)/1073741824;} // deterministic -1..1
function tf(el,o){ // one transform writer: x,y,rx,ry,r,skx,s,sx,sy + o(pacity) + blur
  let t='';
  if(o.x!==undefined||o.y!==undefined) t+=`translate3d(${(o.x||0).toFixed(2)}px,${(o.y||0).toFixed(2)}px,0) `;
  if(o.rx) t+=`rotateX(${o.rx}deg) `; if(o.ry) t+=`rotateY(${o.ry}deg) `; if(o.r) t+=`rotate(${o.r}deg) `;
  if(o.skx) t+=`skewX(${o.skx}deg) `;
  if(o.s!==undefined) t+=`scale(${o.s}) `; if(o.sx!==undefined||o.sy!==undefined) t+=`scale(${o.sx??1},${o.sy??1}) `;
  el.style.transform=t||'none';
  if(o.o!==undefined) el.style.opacity=clamp(o.o);
  if(o.blur!==undefined) el.style.filter=o.blur>0.05?`blur(${o.blur.toFixed(2)}px)`:'none';
}
const vis=(el,on)=>{el.style.visibility=on?'visible':'hidden'};
const dash=(el,p)=>{el.style.strokeDasharray='1 1';el.style.strokeDashoffset=String(1-clamp(p))}; // draw-on for pathLength=1
function reveal(root,t,start,stagger,dur,from=150,ease='outExpo'){ // .mk words/chars rise into place
  root.querySelectorAll('.mk>span').forEach((sp,i)=>{const p=A(t,start+i*stagger,start+i*stagger+dur,ease);
    sp.style.transform=`translate3d(0,${((1-p)*from).toFixed(2)}%,0) rotate(${((1-p)*6).toFixed(2)}deg)`;});
}
function hide(root,t,start,stagger,dur){ // .mk words rise out
  root.querySelectorAll('.mk>span').forEach((sp,i)=>{const p=A(t,start+i*stagger,start+i*stagger+dur,'inExpo');if(p>0)sp.style.transform=`translate3d(0,${(-p*150).toFixed(2)}%,0)`;});
}
const GL='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#/+';
function scramble(txt,t,start,per,rate=24){ // decode effect for mono identifiers and labels
  let out='';const fr=Math.floor(t*rate);
  for(let i=0;i<txt.length;i++){const c=txt[i],ti=start+i*per;
    if(t>=ti+per*3||c===' '||c==='·')out+=(t<start&&c!==' ')?' ':c; else if(t<ti)out+=' '; else out+=GL[Math.abs(Math.floor(hash(i*97+fr*13)*1000))%GL.length];}
  return out;
}
function splitChars(el){el.innerHTML=[...el.textContent].map(c=>`<span class="mk"><span>${c===' '?'&nbsp;':c}</span></span>`).join('');}
const gctx=$('grain').getContext('2d'),gimg=gctx.createImageData(960,540);
function grain(frame){let s=(frame*2654435761)>>>0;const d=gimg.data;for(let i=0;i<d.length;i+=4){s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;d[i]=d[i+1]=d[i+2]=s&255;d[i+3]=255;}gctx.putImageData(gimg,0,0);}

// ================= build =================
splitChars($('word'));splitChars($('eWord'));
for(let i=0;i<18;i++){const r=document.createElement('div');r.className='abs ray';
  r.style.cssText=`left:0;top:-2px;height:4px;border-radius:2px;background:${['var(--accent)','#fff','var(--brand)'][i%3]};transform-origin:0 50%`;$('rays').appendChild(r);}
const ROWS=[['First step','What the user does first'],['Second step','What the product checks'],['Third step','What the user gets']];
ROWS.forEach((r,i)=>{const d=document.createElement('div');d.className='row';d.style.top=(i*100)+'px';
  d.innerHTML=`<div class="num"><span class="n">0${i+1}</span><div class="abs ck" style="inset:-2px;border-radius:50%;background:var(--ok)"></div>
   <svg class="abs" style="left:12px;top:12px" width="26" height="26" viewBox="0 0 24 24"><path class="ckp" d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></svg></div>
   <div><div class="rt">${r[0]}</div><div class="rs">${r[1]}</div></div>`;$('rowsB').appendChild(d);});
const L={};
function layout(){ // measure after fonts load: centre the lockups on their real widths
  const ww=$('word').offsetWidth,x0=960-(132+40+ww)/2; L.markCx=x0+66; $('word').style.left=(x0+172)+'px';
  L.eb='CATEGORY · PLACE · YEAR'; const e=$('ebA'); e.textContent=L.eb; e.style.left=(960-e.offsetWidth/2)+'px';
  const el=$('endLock'); el.style.left=(960-el.offsetWidth/2)+'px';
}

// ================= scenes: each is a pure function of t =================
function atmosphere(t){
  const k=0.35+0.65*A(t,1.2,2.2,'outCubic')+0.35*pulse(t,2.0,0.18);
  tf($('glowA'),{x:900+Math.sin(t*.45)*260,y:-300+Math.cos(t*.37)*160,s:.9+.1*Math.sin(t*.8),o:k});
  tf($('glowB'),{x:-500+Math.sin(t*.3+1)*200,y:300+Math.cos(t*.5)*120,o:k*.8});
  tf($('dots'),{x:((t*14)%48+48)%48-48,y:((t*6)%48)-48});
  $('flash').style.opacity=(0.5*pulse(t,2.0,0.07)).toFixed(3);
}
function sceneA(t){
  const el=$('sA');vis(el,t<3.3);if(t>=3.3)return;
  // dot -> line -> rounded square
  const pDot=A(t,.05,.35,'outBack'),pW=A(t,.3,.62,'inOutExpo'),pH=A(t,.58,.92,'outExpo');
  let w=lerp(18*pDot,220,pW),h=18*pDot;
  if(t>=.3&&t<.58)h=lerp(18,6,A(t,.3,.45,'outCubic')); if(t>=.58)h=lerp(6,220,pH); if(t<.3)w=18*pDot;
  const mb=$('markBox');Object.assign(mb.style,{width:w+'px',height:h+'px',marginLeft:(-w/2)+'px',marginTop:(-h/2)+'px',borderRadius:(Math.min(w,h)/2*(1-pH)+48*pH)+'px'});
  document.querySelectorAll('#markGlyph .gs').forEach((p,i)=>dash(p,A(t,.9+i*.14,1.15+i*.14,'outCubic')));
  const hit=pulse(t,1.47,.06), pm=A(t,1.72,2.22,'inOutExpo');
  tf($('markWrap'),{x:lerp(960,L.markCx,pm)-960,s:lerp(1,.6,pm)*(t<1.45?lerp(.85,1,A(t,0,1.45,'outCubic')):1)*(1+.08*hit),r:lerp(-8,0,A(t,.3,1.2,'outCubic'))});
  const pr=P(t,1.44,2.3);tf($('ringA'),{s:lerp(.55,2.6,E.outExpo(pr)),o:pr>0?(1-pr)*.9:0});
  document.querySelectorAll('.ray').forEach((r,i)=>{const p=P(t,1.45+hash(i)*.04,2.05+hash(i+9)*.15);
    r.style.width=(lerp(90,0,E.inCubic(p))*(.6+.4*Math.abs(hash(i+7))))+'px';
    r.style.transform=`rotate(${i/18*360+hash(i+5)*8}deg) translateX(${150+E.outExpo(p)*(260+120*hash(i+3))}px)`;r.style.opacity=p>0&&p<1?1:0;});
  reveal($('word'),t,2.02,.035,.7);
  $('ebA').textContent=scramble(L.eb,t,2.4,.02);
  const ex=A(t,2.75,3.15,'inExpo');
  tf(el,{s:(1+.05*A(t,2,3.1,'lin'))*(1+ex*.15),x:-ex*260,blur:ex*10});
}
function wipe(t){ // three skewed slabs; the outgoing scene is clipped left of the leading edge, the incoming one right of the trailing edge
  const p1=A(t,2.72,3.26,'inOutExpo'),p2=A(t,2.77,3.34,'inOutExpo'),p3=A(t,2.8,3.38,'inOutExpo');
  const x1=lerp(2300,-1400,p1),x2=lerp(2400,-1900,p2),x3=lerp(3850,-400,p3),k=134.6; // k = tan(14deg)*540
  const lead=Math.min(x1,x2,x3),trail=Math.max(x1+900,x2+1500,x3+60);
  $('wA').style.clipPath=`polygon(0 0,${lead+k}px 0,${lead-k}px 1080px,0 1080px)`;
  $('wB').style.clipPath=`polygon(${trail+k}px 0,1920px 0,1920px 1080px,${trail-k}px 1080px)`;
  vis($('slabs'),t>2.7&&t<3.45);
  tf($('slab1'),{x:x1,skx:-14});tf($('slab2'),{x:x2,skx:-14});tf($('slab3'),{x:x3,skx:-14});
}
function sceneB(t){
  const el=$('sB');vis(el,t>2.9&&t<7.0);if(!(t>2.9&&t<7.0))return;
  reveal($('hB1'),t,3.05,0,.8);reveal($('hB2'),t,3.18,0,.8);
  tf($('ebB'),{o:A(t,3.1,3.5,'lin')}); tf($('subB'),{o:A(t,3.6,4.1,'lin'),y:(1-A(t,3.6,4.2))*30});
  const pc=A(t,3.15,4.0);tf($('cardB'),{x:(1-pc)*420,ry:lerp(-38,-9,pc)+A(t,4,6.6,'inOutCubic')*5,rx:lerp(8,2,pc),o:A(t,3.15,3.45,'lin')});
  const T=[4.2,4.6,5.0];let done=0;
  document.querySelectorAll('#rowsB .row').forEach((r,i)=>{if(t>=T[i])done++;
    const rin=A(t,3.35+i*.06,3.95+i*.06);tf(r,{y:(1-rin)*30,o:rin});
    tf(r.querySelector('.ck'),{s:clamp(A(t,T[i],T[i]+.35,'outBack'),0,1.2),o:t>=T[i]?1:0});
    dash(r.querySelector('.ckp'),A(t,T[i]+.08,T[i]+.3,'outCubic')); r.querySelector('.n').style.opacity=1-P(t,T[i],T[i]+.1);});
  $('barB').style.width=(100*T.reduce((s,x)=>s+A(t,x,x+.3),0)/3)+'%';
  tf($('bDraft'),{o:1-P(t,5.4,5.5)});tf($('bDone'),{o:P(t,5.4,5.47),s:clamp(A(t,5.4,5.75,'outBack'),.001,1.2)});
  const ex=A(t,6.45,6.85,'inExpo');   // zoom-through exit
  tf(el,{s:(1+.04*A(t,3,6.4,'lin'))*(1+ex*.35),blur:ex*14,o:1-A(t,6.72,6.86,'lin')});
}
function sceneC(t){
